<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DatingLy – xem thử logo</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,sans-serif;margin:0;padding:24px;background:#f6f6f8;color:#222}
  h1{font-size:22px} .row{display:flex;gap:28px;flex-wrap:wrap}
  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0001;width:300px}
  .card h2{font-size:15px;margin:0 0 12px}
  .big{width:200px;height:200px;display:block;margin:0 auto 14px}
  .sizes{display:flex;gap:12px;align-items:flex-end;justify-content:center}
  .circle{border-radius:50%;overflow:hidden}
  .dark{background:#121212}
  .lock{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px;border-radius:12px;background:#fff}
  .lock.dark{background:#121212;color:#fff}
  .lock b{font-size:22px;letter-spacing:1px}
  img{display:block}
</style></head><body>
<h1>DatingLy – 3 hướng logo</h1>
<div class="row">
  <div class="card"><h2>A. Thẻ quẹt + trái tim</h2>
    <img class="big" src="logo_icon.svg">
    <div class="sizes"><img src="logo_icon.svg" width="64"><img class="circle" src="logo_icon.svg" width="48"><img src="logo_icon.svg" width="32"><img src="logo_icon.svg" width="20"></div>
    <div class="lock"><img src="logo_icon.svg" width="40"><b>DatingLy</b></div>
    <div class="lock dark"><img src="logo_icon.svg" width="40"><b>DatingLy</b></div>
  </div>
  <div class="card"><h2>B. Chữ D chứa trái tim</h2>
    <img class="big" src="logo_icon_b_letter.svg">
    <div class="sizes"><img src="logo_icon_b_letter.svg" width="64"><img class="circle" src="logo_icon_b_letter.svg" width="48"><img src="logo_icon_b_letter.svg" width="32"><img src="logo_icon_b_letter.svg" width="20"></div>
    <div class="lock"><img src="logo_icon_b_letter.svg" width="40"><b>DatingLy</b></div>
    <div class="lock dark"><img src="logo_icon_b_letter.svg" width="40"><b>DatingLy</b></div>
  </div>
  <div class="card"><h2>C. Bong bóng chat + trái tim</h2>
    <img class="big" src="logo_icon_c_bubble.svg">
    <div class="sizes"><img src="logo_icon_c_bubble.svg" width="64"><img class="circle" src="logo_icon_c_bubble.svg" width="48"><img src="logo_icon_c_bubble.svg" width="32"><img src="logo_icon_c_bubble.svg" width="20"></div>
    <div class="lock"><img src="logo_icon_c_bubble.svg" width="40"><b>DatingLy</b></div>
    <div class="lock dark"><img src="logo_icon_c_bubble.svg" width="40"><b>DatingLy</b></div>
  </div>
</div>
</body></html>
